<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkerSaathi — Voice Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2035;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.3);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.3);
            --yellow: #eab308;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: 500;
        }
        .status-badge.disconnected { background: var(--red-glow); color: var(--red); }
        .status-badge.connecting { background: rgba(234, 179, 8, 0.2); color: var(--yellow); }
        .status-badge.connected { background: var(--green-glow); color: var(--green); }
        .status-badge.listening { background: var(--accent-glow); color: #818cf8; }

        /* Main layout */
        .main {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem;
            max-height: calc(100vh - 60px);
        }

        /* Chat panel */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .msg {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.agent {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg.agent.interrupted { opacity: 0.5; }
        .msg.system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 0.25rem;
        }
        .msg.safety {
            align-self: flex-start;
            background: var(--red-glow);
            border: 1px solid var(--red);
            color: var(--text-primary);
        }
        .msg .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
            color: var(--text-muted);
        }
        .msg.user .label { color: rgba(255,255,255,0.7); }

        /* Mic button area */
        .mic-area {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            border-top: 1px solid var(--border);
        }
        .mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
        }
        .mic-btn.start {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .mic-btn.start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .mic-btn.stop {
            background: linear-gradient(135deg, #ef4444, #f97316);
            box-shadow: 0 0 20px var(--red-glow);
        }
        .mic-btn.recording {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px var(--red-glow); }
            50% { box-shadow: 0 0 40px var(--red-glow), 0 0 60px rgba(239,68,68,0.15); }
        }
        .mic-btn svg { width: 28px; height: 28px; fill: white; }
        .mic-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Side panel */
        .side-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1rem;
        }
        .card h3 {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }
        .field-row {
            display: flex;
            justify-content: space-between;
            padding: 0.35rem 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }
        .field-row:last-child { border-bottom: none; }
        .field-key { color: var(--text-secondary); }
        .field-val { color: var(--text-primary); font-weight: 500; }
        .field-val.empty { color: var(--text-muted); font-style: italic; }

        .tool-log {
            max-height: 200px;
            overflow-y: auto;
        }
        .tool-entry {
            font-size: 0.78rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .tool-entry .tool-name {
            color: var(--accent);
            font-weight: 600;
        }
        .tool-entry .tool-status {
            font-size: 0.7rem;
            color: var(--green);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚖️ WorkerSaathi Voice Agent</h1>
    <span id="statusBadge" class="status-badge disconnected">Disconnected</span>
</div>

<div class="main">
    <!-- Chat -->
    <div class="chat-panel">
        <div class="chat-messages" id="chatMessages">
            <div class="msg system">Click the microphone to start a conversation</div>
        </div>
        <div class="mic-area">
            <button class="mic-btn start" id="micBtn" onclick="toggleSession()">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <span class="mic-hint" id="micHint">Click to start</span>
        </div>
    </div>

    <!-- Side panel -->
    <div class="side-panel">
        <div class="card">
            <h3>📋 Case State</h3>
            <div id="caseFields">
                <div class="field-row"><span class="field-key">Status</span><span class="field-val empty" id="fStatus">—</span></div>
                <div class="field-row"><span class="field-key">Worker Type</span><span class="field-val empty" id="fWorkerType">—</span></div>
                <div class="field-row"><span class="field-key">Issue</span><span class="field-val empty" id="fIssue">—</span></div>
                <div class="field-row"><span class="field-key">State</span><span class="field-val empty" id="fState">—</span></div>
                <div class="field-row"><span class="field-key">Employer</span><span class="field-val empty" id="fEmployer">—</span></div>
                <div class="field-row"><span class="field-key">Amount</span><span class="field-val empty" id="fAmount">—</span></div>
                <div class="field-row"><span class="field-key">Safety</span><span class="field-val empty" id="fSafety">—</span></div>
            </div>
        </div>
        <div class="card" style="flex:1; overflow:hidden;">
            <h3>🔧 Tool Calls</h3>
            <div class="tool-log" id="toolLog">
                <div class="tool-entry" style="color:var(--text-muted)">No tool calls yet</div>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/v1';
const WS_BASE = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') +
                '//' + window.location.host + '/api/v1';

let sessionId = null;
let ws = null;
let audioCtx = null;
let micStream = null;
let scriptProcessor = null;
let isRunning = false;

const badge = document.getElementById('statusBadge');
const micBtn = document.getElementById('micBtn');
const micHint = document.getElementById('micHint');
const chatEl = document.getElementById('chatMessages');
const toolLog = document.getElementById('toolLog');

// ── UI helpers ────────────────────────────────────────────────

function setStatus(status, text) {
    badge.className = 'status-badge ' + status;
    badge.textContent = text;
}

function addMsg(type, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = type === 'user' ? 'You' : type === 'agent' ? 'WorkerSaathi' : type === 'safety' ? '🚨 Safety Alert' : '';
    if (label.textContent) div.appendChild(label);
    div.appendChild(document.createTextNode(text));
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
}

function addToolEntry(name, status) {
    if (toolLog.children.length === 1 && toolLog.children[0].textContent === 'No tool calls yet') {
        toolLog.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'tool-entry';
    div.innerHTML = `<span class="tool-name">${name}</span> <span class="tool-status">${status}</span>`;
    toolLog.appendChild(div);
    toolLog.scrollTop = toolLog.scrollHeight;
}

function updateCaseField(id, val) {
    const el = document.getElementById(id);
    if (!el) return;
    if (val && val !== 'unknown' && val !== 'Unknown') {
        el.textContent = val.replace(/_/g, ' ');
        el.className = 'field-val';
    }
}

async function pollCase() {
    if (!sessionId) return;
    try {
        const r = await fetch(`${API_BASE}/sessions/${sessionId}/case`);
        if (!r.ok) return;
        const c = await r.json();
        updateCaseField('fStatus', c.status);
        updateCaseField('fWorkerType', c.worker_type);
        updateCaseField('fIssue', c.issue_category);
        updateCaseField('fState', c.state);
        updateCaseField('fEmployer', c.platform_or_employer);
        updateCaseField('fAmount', c.amount ? '₹' + c.amount : null);
        updateCaseField('fSafety', c.safety_level);
    } catch(e) {}
}

// ── Audio playback ────────────────────────────────────────────
// AssemblyAI outputs PCM16 mono at 24kHz
const AAI_SAMPLE_RATE = 24000;
let nextPlayTime = 0;

function playAudioChunk(base64) {
    if (!audioCtx) return;
    // Decode base64 safely (no spread operator — avoids stack overflow)
    const binaryStr = atob(base64);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

    // Convert PCM16 LE to Float32
    const samples = new Int16Array(bytes.buffer);
    const floats = new Float32Array(samples.length);
    for (let i = 0; i < samples.length; i++) floats[i] = samples[i] / 32768;

    // Create audio buffer at AssemblyAI's output rate
    const buf = audioCtx.createBuffer(1, floats.length, AAI_SAMPLE_RATE);
    buf.getChannelData(0).set(floats);

    // Schedule gapless playback
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    src.start(nextPlayTime);
    nextPlayTime += buf.duration;
}

function flushAudio() {
    // Reset scheduling so next chunk starts immediately
    nextPlayTime = 0;
}

// ── Session + WebSocket ───────────────────────────────────────

async function toggleSession() {
    if (isRunning) {
        stopSession();
    } else {
        await startSession();
    }
}

async function startSession() {
    setStatus('connecting', 'Connecting...');
    micHint.textContent = 'Connecting...';

    // 1. Create session via REST
    try {
        const r = await fetch(`${API_BASE}/sessions`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
        const data = await r.json();
        sessionId = data.session_id;
        addMsg('system', `Session ${sessionId} created`);
    } catch(e) {
        setStatus('disconnected', 'Connection Failed');
        addMsg('system', 'Failed to create session: ' + e.message);
        return;
    }

    // 2. Audio context — use default sample rate for best playback quality
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 3. Connect WebSocket
    const wsUrl = `${WS_BASE}/voice/${sessionId}`;
    ws = new WebSocket(wsUrl);

    ws.onopen = async () => {
        setStatus('connected', 'Connected');

        // 4. Get microphone
        try {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
        } catch(e) {
            addMsg('system', 'Microphone access denied. Please allow microphone access.');
            stopSession();
            return;
        }

        const micCtx = new AudioContext({ sampleRate: 16000 });
        const source = micCtx.createMediaStreamSource(micStream);
        scriptProcessor = micCtx.createScriptProcessor(4096, 1, 1);

        scriptProcessor.onaudioprocess = (e) => {
            if (!isRunning || !ws || ws.readyState !== 1) return;
            const float32 = e.inputBuffer.getChannelData(0);
            const int16 = new Int16Array(float32.length);
            for (let i = 0; i < float32.length; i++) {
                int16[i] = Math.max(-32768, Math.min(32767, Math.floor(float32[i] * 32768)));
            }
            // Safe base64 encode (chunk to avoid stack overflow)
            const uint8 = new Uint8Array(int16.buffer);
            let binary = '';
            for (let i = 0; i < uint8.length; i++) binary += String.fromCharCode(uint8[i]);
            const base64 = btoa(binary);
            ws.send(JSON.stringify({ type: 'input.audio', audio: base64 }));
        };

        source.connect(scriptProcessor);
        scriptProcessor.connect(micCtx.destination);

        isRunning = true;
        micBtn.className = 'mic-btn stop recording';
        micBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>';
        micHint.textContent = 'Listening... click to stop';
        setStatus('listening', '🎤 Listening');
    };

    ws.onmessage = (e) => {
        const event = JSON.parse(e.data);
        const type = event.type;

        if (type === 'session.ready') {
            addMsg('system', 'WorkerSaathi is ready. Speak now!');
        }
        else if (type === 'transcript.user') {
            const text = event.text;
            if (text && text.trim()) addMsg('user', text);
        }
        else if (type === 'transcript.agent') {
            const text = event.text;
            const interrupted = event.interrupted;
            if (text && text.trim()) {
                const el = addMsg('agent', text);
                if (interrupted) el.classList.add('interrupted');
            }
            if (interrupted) flushAudio();
        }
        else if (type === 'reply.audio') {
            if (event.data) playAudioChunk(event.data);
        }
        else if (type === 'reply.done') {
            if (event.status === 'interrupted') flushAudio();
            pollCase();  // refresh side panel
        }
        else if (type === 'tool.call') {
            addToolEntry(event.name, '⏳ executing...');
        }
        else if (type === 'session.ended') {
            addMsg('system', 'Session ended');
            stopSession();
        }
        else if (type === 'error') {
            addMsg('system', '⚠️ ' + (event.message || 'Unknown error'));
        }
    };

    ws.onclose = () => {
        if (isRunning) {
            addMsg('system', 'Connection closed');
            stopSession();
        }
    };

    ws.onerror = (e) => {
        addMsg('system', '⚠️ WebSocket error');
    };
}

function stopSession() {
    isRunning = false;
    if (ws && ws.readyState === 1) {
        try { ws.send(JSON.stringify({ type: 'session.end' })); } catch(e) {}
        ws.close();
    }
    ws = null;
    if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
    }
    if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor = null;
    }
    flushAudio();
    micBtn.className = 'mic-btn start';
    micBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>';
    micHint.textContent = 'Click to start';
    setStatus('disconnected', 'Disconnected');
}
</script>

</body>
</html>
