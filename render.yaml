services:
  - type: web
    name: workersaathi
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SARVAM_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: TAVILY_API_KEY
        sync: false
      - key: EMBEDDING_BACKEND
        value: openai
      - key: EMBEDDING_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b:free
